{% extends "base.html" %}
{% block title %}登录 · 千薪万苦{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-logo">薪</div>
      <h1>千薪万苦 · 计算器</h1>
      <p>每一秒都在为生活加值</p>
    </div>
    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" name="username" autocomplete="username" required
               placeholder="请输入用户名" autofocus />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" name="password" autocomplete="current-password" required
               placeholder="请输入密码" />
      </div>
      <button type="submit" class="btn-primary">登 录</button>
      <p class="auth-link">还没有账号？ <a href="{{ url_for('register') }}">立即注册</a></p>
    </form>
  </div>
</div>
{% endblock %}
